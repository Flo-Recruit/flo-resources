# The generated pages are built from source directories: pipeline/ builds the tracker and
# prompts/ builds the prompt library. site/ is the output, and Vercel serves site/ directly. Nothing else checks that the two agree -- the Vercel check only
# reports that a deploy succeeded, and every other workflow here is a scheduled data job that
# never runs on a pull request. So a PR could merge with a stale artifact, or with pipeline
# changes whose output was never regenerated, and the live page would silently disagree with
# the source. This rebuilds and fails if the committed output differs.
name: Verify build output

on:
  pull_request:
    paths:
      - 'pipeline/**'
      - 'ai/**'
      - 'site/**'
      - 'decksync/**'
      - '.github/workflows/verify-build.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild both tracker variants
        working-directory: pipeline
        run: python3 build.py

      - name: Validate prompt data
        working-directory: ai/prompts
        run: python3 validate_data.py

      - name: Rebuild the prompt library
        working-directory: ai/prompts
        run: python3 build.py

      - name: Fail if the committed output is stale
        run: |
          if git diff --quiet -- site/; then
            echo "site/ matches a fresh build of pipeline/ and ai/."
          else
            echo "::error::site/ does not match a fresh build. Run 'python3 pipeline/build.py' and 'python3 ai/prompts/build.py', then commit the result."
            echo
            echo "Files that differ:"
            git diff --stat -- site/
            exit 1
          fi

      - name: Deck slides still render from data.json
        run: python3 decksync/run.py check --data pipeline/data.json
